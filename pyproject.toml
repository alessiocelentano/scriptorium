[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.2.0"
description = "Turn video lectures into linked Markdown notes and spaced-repetition flashcards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cele" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
asr = [
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "ruff>=0.5",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scriptorium = ["prompts/*.md", "skills/*/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
